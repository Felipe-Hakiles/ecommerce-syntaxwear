<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Compre tênis e sneakers de alta qualidade na SyntaxWear. Encontre os melhores modelos para homens e mulheres, com preços incríveis e entrega rápida. Explore nossa coleção agora!" />
		<title>SyntaxWear  - Tênis e Sneakers Online</title>
		<link rel="stylesheet" href="./css/reset.css">
		<link rel="stylesheet" href="./css/variables.css" />
		<link rel="stylesheet" href="/css/base.css" />
		<link rel="stylesheet" href="/css/layout.css" />
		<link rel="stylesheet" href="./css/components/header.css" />
		<link rel="stylesheet" href="./css/components/hero.css" />

	<body>
		<header class="header">
			<!-- Logo e nav	egação -->
			 <h1 class="logo">
				<a href="/" title="SyntaxWear  - Tênis e Sneakers Online">
					<img src="./images/logo/Logo.png" alt="SyntaxWear - Tênis e Sneakers de Alta Qualidade" />
				</a>
			 </h1>
			 <nav class="nav-center" aria-label="Categorias Principais">
				<ul>
					<li><a href="#">Maculino </a></li>
					<li><a href="#">Feminino</a></li>
					<li><a href="#">Outlet</a></li>
				</ul>
			</nav>

			<nav class="nav-secondary" aria-label="Menu secundário">
				<ul>
					<li><a href="#">Nossas lojas</a></li>
					<li><a href="#">Sobre</a></li>
					<li><a href="#" aria-label="minha-conta">
						<img src="./images/icons/minhaconta.png" alt="Minha Conta" />
					</a>
						
					</li>
					<li><a href="#" aria-label="Ajuda">
						<img src="./images/icons/ajuda.png" alt="Ajuda" />
					</a></li>
					<li><a href="#" aria-label="Carrinho">
						<img src="./images/icons/sacola.png" alt="Sacola de Compras" />
					</a></li>
				</ul>
			</nav>
		</header>

		<main>
			<section class="hero-section">
				<!-- Seção hero -->
				 <div class="hero-overlay">

				 <div class="hero-content">
					<span class="hero-subtitle">Krypton one</span>
					<h2 class="hero-title">O tênis mais confortável do mercado</h2>
					<div class="hero-buttons">
						<a href="#" class="btn btn-outline">Ver modelos</a>
						<a href="#" class="btn btn-filled">Comprar</a>
					</div>
				 </div>
				 </div>
			</section>

			<section class="categories-section">
				<!-- Seção de categorias de tênis -->
				
					<div class="category-card casual">
						<a href="#" class="category-link">
							<span class="overlay"></span>
							<span class="category-name btn btn-outline">Casual</span>

						</a>
					</div>
					
					<div class="category-card esporte">
						<a href="#" class="category-link">
							<span class="overlay"></span>
							<span class="category-name btn btn-outline">Esporte</span>

						</a>
					</div>
						
					<div class="category-card moderno">
						<a href="#" class="category-link">
							<span class="overlay"></span>
							<span class="category-name btn btn-outline">Moderno</span>

						</a>
					</div>
						
					<div class="category-card futurista">
						<a href="#" class="category-link">
							<span class="overlay"></span>
							<span class="category-name btn btn-outline">Futurista</span>

						</a>
				    </div>
				 
			</section>

			<section class="grid-section">
				<!-- Grid com produtos em destaque -->
				 <div class="card top1">
					<div class="card-content">
						<h3 class="card-title">Krypton One</h3>
						<p class="card-subtitle">Estilo Urbano com atitude</p>
						<div class="cta-group">
							<a href="#" class="btn btn-outline">Feminino</a>
							<a href="#" class="btn btn-outline">Masculino</a>
						</div>

				 	</div>
			     </div>
				 <div class="card top2"></div>
				 <div class="card midL"></div>
				 <div class="card midR"></div>
				 <div class="card bottomL"></div>
				 <div class="card bottomR"></div>

		<footer class="site-footer">
			<!-- Informações de contato e links -->
		</footer>
